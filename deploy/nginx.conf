server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_vary on;

  location = /console.html {
    sub_filter '</body>' '<script src="/code_event_sync.js"></script></body>';
    sub_filter_once on;
    try_files $uri =404;
  }

  location = /stage.html {
    sub_filter '</body>' '<script src="/code_event_sync.js"></script></body>';
    sub_filter_once on;
    try_files $uri =404;
  }

  location /react-gpu/ {
    try_files $uri $uri/ /react-gpu/index.html;
  }

  location = /react-gpu/ {
    add_header Cache-Control "no-store";
    try_files $uri /react-gpu/index.html;
  }

  location ~* \.(?:js|css|woff2|wasm)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location = /state.html {
    return 404;
  }

  location /influx/ {
    proxy_pass http://influxdb:8086/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
