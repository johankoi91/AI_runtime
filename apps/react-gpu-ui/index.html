<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mini runtime execution profiler</title><style>body{margin:0;background:#08111f;color:#edf5ff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#root{min-height:100vh}.boot{max-width:900px;margin:80px auto;padding:28px;background:#12223a;border:1px solid #304b70;border-radius:12px}.boot h1{margin:0 0 10px;font-size:24px}.boot p{color:#9db0ce}.boot code{color:#72e5df}</style></head><body><div id="root"><div class="boot"><h1>mini runtime / execution profiler</h1><p>正在加载 React 控制台、Graph、GPU 和 Runtime 数据…</p><p><code>React → Graph → GPU → Runtime</code></p></div></div><script>window.addEventListener('error',event=>{document.getElementById('root').innerHTML='<div class="boot"><h1>页面初始化错误</h1><p>'+String(event.error?.stack||event.message)+'</p><p>请把这段错误发给我，我会继续修复。</p></div>'});window.addEventListener('unhandledrejection',event=>{document.getElementById('root').innerHTML='<div class="boot"><h1>页面异步加载错误</h1><p>'+String(event.reason?.stack||event.reason)+'</p></div>'});</script><script type="module" src="/src/safe2.jsx"></script></body></html>
