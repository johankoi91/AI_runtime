<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mini runtime GPU journey</title><style>:root{color-scheme:dark;--bg:#08111f;--p:#12223a;--line:#304b70;--t:#edf5ff;--m:#9db0ce;--b:#65baff;--u:#b99aff;--o:#ffc46d;--g:#5ee0ae;--c:#72e5df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#294d7c,#08111f 54%);color:var(--t);font:13px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1250px;margin:auto;padding:20px}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:15px}.muted{color:var(--m)}.top{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:10px}.buttons{display:flex;gap:6px;flex-wrap:wrap}button,input{border:1px solid var(--line);background:#192d4a;color:var(--t);border-radius:7px;padding:8px 10px;font-weight:600}button{cursor:pointer}button.primary{background:var(--g);color:#06151a;border-color:var(--g)}.config{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:6px;background:#0e192b;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.config label{display:grid;gap:2px;color:var(--m);font-size:10px}.config input{font-size:11px;width:100%}.status{color:var(--g);min-height:20px;margin:7px 0}.stage{height:545px;background:radial-gradient(circle at 50% 42%,#1e4269,#0c1729 63%);border:1px solid var(--line);border-radius:15px;position:relative;overflow:hidden}.stage h2{text-align:center;padding-top:13px}.sub{text-align:center;color:var(--m);font-size:11px;margin-top:3px}.orbit{position:absolute;left:50%;top:45%;width:78%;height:235px;border:1px dashed #385d85;border-radius:50%;transform:translate(-50%,-50%)}.node{position:absolute;width:108px;height:108px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#172c49;border:1px solid var(--line);z-index:2;transition:.5s}.node b{font-size:15px}.node small{color:var(--m);margin-top:4px}.node.active{border-color:var(--o);box-shadow:0 0 34px #ffc46d88;transform:scale(1.12)}.node.done{border-color:var(--g);background:#20564d}.tensor{left:5%;top:39%}.graph{left:29%;top:15%}.gpu{right:5%;top:39%}.output{left:29%;bottom:6%}.packet{position:absolute;z-index:3;left:14%;top:49%;width:19px;height:19px;border-radius:50%;background:var(--o);box-shadow:0 0 22px var(--o);transition:left .65s,top .65s}.caption{position:absolute;left:17%;right:17%;bottom:25px;text-align:center;background:#0b182bd9;border:1px solid var(--line);border-radius:9px;padding:11px}.caption b{display:block;color:var(--o);font-size:16px;margin-bottom:3px}.caption span{color:#dce9fb;font-size:12px}.steps{display:flex;gap:3px;position:absolute;left:20%;right:20%;bottom:9px}.steps i{height:5px;flex:1;background:#294263;border-radius:99px}.steps i.on{background:var(--o)}.details{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:9px}.card{background:#12223ae8;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:88px}.card h3{color:var(--c);font-size:11px;margin-bottom:6px}.card p{color:#dce9fb;font-size:12px}.facts{display:grid;gap:3px}.fact{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #263957;padding:4px 0;color:var(--m);font-size:10px}.fact b{color:var(--t);text-align:right}.bottom{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-top:9px}.panel{background:#12223ae8;border:1px solid var(--line);border-radius:8px;padding:10px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.tag{color:var(--c);border:1px solid #286c75;padding:3px 7px;border-radius:99px;font-size:10px}.threads{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.thread{padding:6px 3px;background:#172943;border:1px solid #294263;border-radius:5px;text-align:center;font:9px/1.35 ui-monospace,monospace}.thread.on{border-color:var(--o);background:#5d482d}.thread.done{border-color:var(--g);background:#20564d}.matrix{display:flex;justify-content:center;align-items:center;gap:8px;min-height:78px}.mat{text-align:center;color:var(--m);font-size:9px}.mat table{border-spacing:2px}.mat td{width:27px;height:22px;background:#203453;border-radius:3px;text-align:center;color:var(--t);font-size:10px}.mat td.hot{background:var(--o);color:#201708}.mat td.done{background:var(--g);color:#061b17}.arrow{color:var(--u);font-size:19px}.code{background:#07111f;border-radius:5px;padding:6px;font:9px/1.65 ui-monospace,monospace;color:#aebfdd}.code .on{display:block;background:#304e76;border-left:2px solid var(--o);padding-left:4px;color:var(--t)}@media(max-width:850px){.top{display:block}.buttons{margin-top:9px}.config{grid-template-columns:1fr 1fr}.config button{grid-column:1/-1}.details,.bottom{grid-template-columns:1fr}.stage{height:600px}.node{width:86px;height:86px}.node b{font-size:12px}.graph,.output{left:28%}.caption{left:7%;right:7%}.threads{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><div class="top"><div><h1>mini runtime / GPU 故事舞台 · detail edition</h1><p class="muted">舞台动画 + 真实事件 + GPU 细节</p></div><div class="buttons"><button class="primary" id="play">▶ 播放旅程</button><button id="pause">Ⅱ 暂停</button><button id="prev">← 上一步</button><button id="next">下一步 →</button><button id="reset">↺ 重置</button></div></div><form class="config" id="config"><label>Influx API<input id="api" value="/influx"></label><label>组织<input id="org" value="mini-runtime"></label><label>Bucket<input id="bucket" value="mini-runtime"></label><label>Token<input id="token" value="mini-runtime-local-token" type="password"></label><button class="primary">加载真实 run</button></form><div class="status" id="status">正在加载真实旅程…</div><section class="stage"><h2>一份数据的 GPU 旅行</h2><p class="sub" id="sub">等待真实事件</p><div class="orbit"></div><div class="node tensor" id="tensor"><b>Tensor</b><small>数据</small></div><div class="node graph" id="graph"><b>Graph</b><small>排顺序</small></div><div class="node gpu" id="gpu"><b>Metal GPU</b><small>并行计算</small></div><div class="node output" id="output"><b>Output</b><small>答案</small></div><div class="packet" id="packet"></div><div class="caption"><b id="title">程序准备开始</b><span id="copy">任务包还在起点。</span></div><div class="steps" id="steps"></div></section><div class="details"><div class="card"><h3>这一站发生什么</h3><p id="what">等待事件</p></div><div class="card"><h3>技术细节</h3><p id="tech">等待事件</p></div><div class="card"><h3>资源变化</h3><div class="facts" id="facts"></div></div></div><div class="bottom"><section class="panel"><div class="panel-title"><h2>GPU 线程</h2><span class="tag" id="kernel">idle</span></div><div class="threads" id="threads"></div></section><section class="panel"><div class="panel-title"><h2>矩阵流转</h2><span class="tag" id="counter">0 / 0</span></div><div class="matrix" id="matrix"></div></section></div><section class="panel" style="margin-top:9px"><div class="panel-title"><h2>代码执行位置</h2><span class="tag">真实事件同步</span></div><div class="code" id="code"></div></section></main><script>
(()=>{let events=[],i=0,timer;const $=x=>document.getElementById(x);const a=[[1,2,3],[4,5,6]],b=[[1,2],[3,4],[5,6]],h=[[22,28],[49,64]],o=[[32,48],[79,104]];const text={run_start:['程序开场','运行任务刚创建。','准备执行 Graph'],device_ready:['GPU 设备就位','M2 Metal device 已准备。','Apple M2'],pipeline_ready:['GPU 程序就位','matmul 和 add kernel 已编译。','pipeline ready'],node_ready:['Node 进入队列','输入依赖已经满足。','Executor queue'],node_start:['Executor 开始工作','选择当前 Node。','Node running'],inputs_ready:['输入到手','Runtime 取出输入 Tensor。','Tensor inputs'],buffer_allocated:['留出输出位置','Runtime 为结果申请空间。','MemoryPool output'],input_buffer_created:['数据进入 GPU','输入被放进 MTLBuffer。','input buffer'],output_buffer_created:['GPU 输出位置准备好','GPU 将来会把结果写这里。','output buffer'],command_buffer_created:['创建命令单','Metal 准备待执行命令。','command buffer'],encoder_configured:['绑定工具和数据','buffer 和参数绑定完成。','compute encoder'],dispatch_configured:['安排线程格子','决定 grid 和 threadgroup。','dispatch grid'],kernel_submitted:['发车：GPU 开始算','任务真正交给 GPU。','kernel submitted'],kernel_completed:['GPU 算完','输出写进 GPU buffer。','kernel completed'],copy_back_started:['答案开始回程','GPU buffer 开始复制回 Tensor。','copy back start'],copy_back_completed:['答案回到 Runtime','Graph 可以读取结果。','Tensor updated'],node_complete:['Node 完成','当前计算节点结束。','Graph Node complete'],run_complete:['旅程完成','整张 Graph 执行成功。','out verified']};function csv(s){const r=[];let row=[],c='',q=0;for(let x of s){if(x==='"')q=!q;else if(x===','&&!q){row.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(row.length){row.push(c);r.push(row)}row=[];c=''}else c+=x}return r}function phase(e){return ['run_start','node_ready','node_start','inputs_ready','node_complete','run_complete'].includes(e)?'graph':['kernel_submitted','kernel_completed'].includes(e)?'gpu':['buffer_allocated','input_buffer_created','output_buffer_created','copy_back_started','copy_back_completed'].includes(e)?'return':'metal'}function mat(name,d,hot=[],done=false){return `<div class="mat">${name}<table>${d.map((r,y)=>`<tr>${r.map((v,x)=>`<td class="${hot.some(p=>p[0]===y&&p[1]===x)?'hot ':''}${done?'done':''}">${v}</td>`).join('')}</tr>`).join('')}</table></div>`}function render(){if(!events.length)return;const e=events[i],p=phase(e.event),s=text[e.event]||[e.event,e.detail||'',e.stage||''];$('counter').textContent=`${i+1} / ${events.length}`;$('sub').textContent=`第 ${i+1} / ${events.length} 站 · ${e.event} · ${new Date(e._time).toLocaleTimeString()}`;$('title').textContent=s[0];$('copy').textContent=s[1];$('what').textContent=s[1];$('tech').textContent=s[2]+(e.detail?` · ${e.detail}`:'');$('facts').innerHTML=[['event',e.event],['bytes',`${e.bytes||0} B`],['duration',`${Number(e.duration_ms||0).toFixed(3)} ms`],['sequence',e.sequence]].map(x=>`<div class="fact"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('kernel').textContent=e.detail||e.event;$('tensor').className='node tensor '+(p==='graph'&&i<3?'active':i>2?'done':'');$('graph').className='node graph '+(p==='graph'&&i>=1&&i<5?'active':i>=5?'done':'');$('gpu').className='node gpu '+(p==='metal'||p==='gpu'?'active':i>=15?'done':'');$('output').className='node output '+(p==='return'?'active':e.event==='run_complete'?'done':'');const pos={graph:[['15%','49%'],['30%','37%'],['42%','30%']],metal:[['55%','34%'],['62%','40%'],['68%','46%']],gpu:[['75%','49%']],return:[['80%','57%'],['78%','62%'],['48%','75%']]};const xy=(pos[p]||pos.graph)[0];$('packet').style.left=xy[0];$('packet').style.top=xy[1];$('steps').innerHTML=events.map((_,n)=>`<i class="${n===i?'on':''}"></i>`).join('');const add=e.detail&&e.detail.includes('add'),matmul=e.detail&&e.detail.includes('matmul');$('threads').innerHTML=Array.from({length:4},(_,n)=>`<div class="thread ${e.event==='kernel_submitted'?'on ':e.event==='kernel_completed'?'done ':''}">${e.event==='kernel_submitted'||e.event==='kernel_completed'?(add?'thread '+n+' → out['+Math.floor(n/2)+','+n%2+']':'thread ('+n%2+','+Math.floor(n/2)+') → hidden['+Math.floor(n/2)+','+n%2+']'):'waiting'}</div>`).join('');$('matrix').innerHTML=i<12?mat('a',a)+mat('b',b)+mat('bias',[[10,20],[30,40]]):matmul?mat('a',a,[[0,0]])+'<span class="arrow">×</span>'+mat('b',b,[[0,0]])+'<span class="arrow">→</span>'+mat('hidden',h,[],e.event==='kernel_completed'):add?mat('hidden',h,[[0,0]])+'<span class="arrow">+</span>'+mat('bias',[[10,20],[30,40]],[[0,0]])+'<span class="arrow">→</span>'+mat('out',o,[],e.event==='kernel_completed'):mat('hidden',h,[],i>17)+'<span class="arrow">→</span>'+mat('out',o,[],i>30);const lines=['Graph graph;','graph.add_node(MatMul(a,b));','graph.add_node(Add(hidden,bias));','MTLBuffer* lhs = newBufferWithBytes(a);','dispatchThreads(2 × 2);','hidden[row,col] = dot(lhs[row],rhs[col]);','out[index] = hidden[index] + bias[index];','memcpy(out Tensor, MTLBuffer);'];const active=e.event==='kernel_submitted'?[4,5]:e.event==='kernel_completed'?[5,6]:e.event.includes('copy_back')?[7]:e.event==='dispatch_configured'?[4]:[];$('code').innerHTML=lines.map((x,n)=>`<span class="${active.includes(n)?'on':''}">${String(n+1).padStart(2,'0')} ${x}</span>`).join('')}async function load(){try{const api=$('api').value.replace(/\/$/,'')||'/influx',org=$('org').value,bucket=$('bucket').value,token=$('token').value,q=`from(bucket: "${bucket}") |> range(start: -24h) |> filter(fn: (r) => r._measurement == "runtime_trace") |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value") |> group(columns: []) |> sort(columns: ["_time"])`,r=await fetch(`${api}/api/v2/query?org=${encodeURIComponent(org)}`,{method:'POST',headers:{Authorization:`Token ${token}`,'Content-Type':'application/vnd.flux',Accept:'application/csv'},body:q}),rows=csv(await r.text()),head=rows.findIndex(x=>x.includes('_time')),h=rows[head],all=rows.slice(head+1).map(x=>Object.fromEntries(h.map((k,n)=>[k,x[n]||'']))).filter(x=>x.event).sort((a,b)=>Date.parse(a._time)-Date.parse(b._time)),run=all[all.length-1].run_id;events=all.filter(x=>x.run_id===run);$('status').textContent=`已加载真实旅程：${events.length} 个事件 · ${run}`;render()}catch(e){$('status').textContent='加载失败：'+e.message}}function next(){if(i<events.length-1){i++;render()}}$('config').onsubmit=e=>{e.preventDefault();load()};$('play').onclick=()=>{clearInterval(timer);timer=setInterval(()=>{if(i>=events.length-1)clearInterval(timer);else next()},1100)};$('pause').onclick=()=>clearInterval(timer);$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=next;$('reset').onclick=()=>{clearInterval(timer);i=0;render()};load()})();
</script></body></html>
